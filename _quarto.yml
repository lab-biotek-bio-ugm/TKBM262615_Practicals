project:
  type: book
  output-dir: _book
  pre-render: python tools/build_figs.py

book:
  title: "TKBM262615 Practicals"
  subtitle: "Lecture notes and Colab notebooks — Computational Biology (TBM263214), Universitas Gadjah Mada"
  repo-url: https://github.com/lab-biotek-bio-ugm/TKBM262615_Practicals
  repo-actions: [source]
  chapters:
    - index.qmd
    - part: "Lecture notes"
      chapters:
        - lecture_notes/L02-the-mathematical-toolkit/notes.md
        - lecture_notes/L03-reaction-networks-and-mass-action/notes.md
        - lecture_notes/L04-conservation-and-numerical-simulation/notes.md
        - lecture_notes/L05-enzyme-kinetics-i/notes.md
        - lecture_notes/L06-enzyme-kinetics-ii/notes.md
    - part: "Practical notebooks"
      chapters:
        - notebooks/01_ode_intro.ipynb
        - notebooks/02_mass_action.ipynb
        - notebooks/02_simple_networks.ipynb
        - notebooks/03_enzyme_kinetics_I.ipynb
        - notebooks/04_enzyme_kinetics_II.ipynb

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    highlight-style: pygments
    number-sections: false
    filters:
      - tools/obsidian.lua

execute:
  freeze: auto
  error: true  # exercise stubs (e.g. 02_simple_networks Exercise 1) raise on purpose
